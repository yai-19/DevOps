\<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica DevOps - Hola Mundo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 12px;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            margin-top: 18px;
            padding: 6px 14px;
            background-color: #2ecc71;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>¡Hola Mundo!</h1>
        <p>Esta es mi tarea de <strong>Electiva 2 (DevOps)</strong></p>
        <span class="badge">Despliegue Automático</span>
    </div>

</body>
</html>
