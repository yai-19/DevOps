<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica DevOps</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7f7f8;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 35px 45px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        p {
            font-size: 1rem;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Hola Mundo!</h1>
        <p>Esta es mi tarea de Electiva 2 (DevOps)</p>
